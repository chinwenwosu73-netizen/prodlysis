<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Comparison metrics table">
  <defs>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7FB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="16" fill="url(#b3)"/>
  <text x="18" y="30" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Period Comparison</text>

  <!-- table header -->
  <rect x="18" y="44" width="284" height="24" rx="6" fill="#EC4899"/>
  <text x="30" y="60" font-family="Inter, sans-serif" font-size="11" fill="#fff">Metric</text>
  <text x="130" y="60" font-family="Inter, sans-serif" font-size="11" fill="#fff">Before</text>
  <text x="205" y="60" font-family="Inter, sans-serif" font-size="11" fill="#fff">After</text>
  <text x="272" y="60" font-family="Inter, sans-serif" font-size="11" fill="#fff">Δ</text>

  <g font-family="Inter, sans-serif" font-size="11" fill="#1F2937">
    <text x="30" y="92">Drop-off Rate</text>
    <text x="130" y="92">42%</text>
    <text x="205" y="92">27%</text>
    <text x="272" y="92" fill="#22C55E">-36%</text>
    <text x="30" y="122">Rage Clicks</text>
    <text x="130" y="122">118</text>
    <text x="205" y="122">64</text>
    <text x="272" y="122" fill="#22C55E">-46%</text>
    <text x="30" y="152">Scroll Depth</text>
    <text x="130" y="152">46%</text>
    <text x="205" y="152">68%</text>
    <text x="272" y="152" fill="#22C55E">+48%</text>
  </g>

  <!-- health badge -->
  <rect x="18" y="170" width="284" height="34" rx="10" fill="#FCE7F3"/>
  <text x="30" y="191" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">UX Health</text>
  <text x="250" y="193" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700" fill="#EC4899">92/100</text>
</svg>
