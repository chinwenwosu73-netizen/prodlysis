<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="UX metrics chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" rx="20" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#F4D3E4" stroke-width="1">
    <line x1="50" y1="60" x2="390" y2="60"/>
    <line x1="50" y1="110" x2="390" y2="110"/>
    <line x1="50" y1="160" x2="390" y2="160"/>
    <line x1="50" y1="210" x2="390" y2="210"/>
  </g>
  <!-- area -->
  <path d="M50,200 C90,190 120,150 150,150 C190,150 210,120 250,115 C290,110 320,95 370,80 L370,240 L50,240 Z" fill="url(#area)"/>
  <!-- line (previous) -->
  <path d="M50,185 C90,180 120,175 150,168 C190,158 210,150 250,142 C290,134 320,128 370,118" fill="none" stroke="#F9A8D4" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- line (current) -->
  <path d="M50,200 C90,190 120,150 150,150 C190,150 210,120 250,115 C290,110 320,95 370,80" fill="none" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>
  <!-- points -->
  <g fill="#EC4899">
    <circle cx="150" cy="150" r="5"/>
    <circle cx="250" cy="115" r="5"/>
    <circle cx="370" cy="80" r="6" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- labels -->
  <text x="50" y="45" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Engagement</text>
  <text x="52" y="275" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">Jun</text>
  <text x="150" y="275" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">Jul</text>
  <text x="250" y="275" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">Aug</text>
  <text x="350" y="275" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">Sep</text>
  <g transform="translate(240,20)">
    <rect width="10" height="10" rx="2" fill="#EC4899"/>
    <text x="16" y="9" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">Current</text>
    <rect x="92" width="10" height="10" rx="2" fill="#F9A8D4"/>
    <text x="108" y="9" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">Previous</text>
  </g>
</svg>
